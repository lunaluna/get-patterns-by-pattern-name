name: Release

# 同梱ライブラリ(lib/l2d-updater)が提供する reusable workflow を呼び、
# タグから配布用 ZIP を組み立てて GitHub Release を作成する。
#
# 参照タグ(@X.Y.Z)は lib/l2d-updater/ のベンダーコピーと必ず揃えること。
# 片方だけ更新すると、ライブラリ本体と利用側で版が食い違う。ライブラリ
# 側の反映手順は https://github.com/lunaluna/l2d-wp-github-update-lib を
# 参照(1.1.0 以降、手順はベンダーコピーには同梱されない)。
#
# 本プラグインのタグに v 接頭辞は付けない慣習(1.1.0 / 1.2.0 ...)。
# ライブラリ側も 1.1.0 以降は v 接頭辞なしに統一されたため、
# ここで参照するタグ(plugin-release.yml@X.Y.Z)にも v を付けない。
# 一方 subtree の取り込み元は配布専用タグ dist-X.Y.Z であり、通常の
# リリースタグ(この参照が指す X.Y.Z)とは別物なので混同しないこと。
# タグフィルタは数字始まりにしている。呼び出し先は "${TAG#v}" で v を
# 取り除くため、接頭辞の有無どちらでもバージョンは正しく解決される。

on:
  push:
    tags: ['[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'リリースするタグ (例 1.6.1).'
        required: true

# 呼び出し先の GITHUB_TOKEN 権限は呼び出し元を超えられないため、
# Release 作成に必要な contents: write はここで与える必要がある。
permissions:
  contents: write

jobs:
  release:
    uses: lunaluna/l2d-wp-github-update-lib/.github/workflows/plugin-release.yml@1.3.1
    with:
      slug: get-patterns-by-pattern-name
      # "path:pattern" 形式。パターンは grep -E の正規表現として使われる.
      # アンカー(^)は使えるが、行頭が合わないと失敗する(例: ヘッダーの " * Version:" に
      # "^Version:" と書くと、grep が一致せず「一致する行が見つかりません」で止まる).
      # ここでは行頭の違いに左右されないよう、アンカーなしで書いている.
      # (呼び出し先は抽出時に sed の置換パターンの途中へも埋め込むが、^ は行頭を指すだけなので
      # 壊れない. アンカー付きでリリースが成功した実績がある: flamingo-csv-sjis-exporter 1.3.0.)
      version_files: |
        get-patterns-by-pattern-name.php:Version:
        readme.txt:Stable tag:
      # readme.txt の "= x.y.z =" 節を抽出する。該当節が無いと
      # "Release x.y.z." の 1 行になるため、リリース前に必ず追記すること。
      notes_source: readme.txt
      # タグを push したら, 公開せずに draft の Release を作る.
      # draft は /releases/latest に出ないので, 公開するまで各サイトの自動更新に届かない.
      # アセットの中身を確認してから `gh release edit <tag> --draft=false` で公開する.
      draft: true
