name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phpcs:
    name: PHPCS (WordPress-Extra + WordPress-Docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
      - uses: ramsey/composer-install@v4
      - run: vendor/bin/phpcs

  phpstan:
    name: PHPStan (level 6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - uses: ramsey/composer-install@v4
      - run: vendor/bin/phpstan analyse

  phpcompatibility:
    name: PHPCompatibilityWP (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - uses: ramsey/composer-install@v4
      - run: vendor/bin/phpcs --standard=PHPCompatibilityWP --runtime-set testVersion ${{ matrix.php }} get-patterns-by-pattern-name.php

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.4']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: ramsey/composer-install@v4
      - name: Download WordPress core
        run: |
          curl -sSL https://wordpress.org/latest.tar.gz | tar xz
          echo "WP_CORE_DIR=${GITHUB_WORKSPACE}/wordpress/" >> "$GITHUB_ENV"
      - name: Write wp-tests-config.php
        run: |
          cat <<'PHP' > wp-tests-config.php
          <?php
          define( 'DB_NAME', 'wordpress_test' );
          define( 'DB_USER', 'root' );
          define( 'DB_PASSWORD', '' );
          define( 'DB_HOST', '127.0.0.1' );
          define( 'DB_CHARSET', 'utf8mb4' );
          define( 'DB_COLLATE', '' );
          $table_prefix = 'wptests_';
          define( 'WP_TESTS_DOMAIN', 'example.org' );
          define( 'WP_TESTS_EMAIL', 'admin@example.org' );
          define( 'WP_TESTS_TITLE', 'Test Blog' );
          define( 'WP_PHP_BINARY', PHP_BINARY );
          define( 'ABSPATH', getenv( 'WP_CORE_DIR' ) );
          PHP
      - run: vendor/bin/phpunit
        env:
          WP_PHPUNIT__TESTS_CONFIG: ${{ github.workspace }}/wp-tests-config.php
          WP_TESTS_PHPUNIT_POLYFILLS_PATH: ${{ github.workspace }}/vendor/yoast/phpunit-polyfills
