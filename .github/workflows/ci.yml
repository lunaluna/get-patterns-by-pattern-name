name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phpcs:
    name: PHPCS (WordPress-Extra + WordPress-Docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/phpcs

  phpstan:
    name: PHPStan (level 6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/phpstan analyse

  phpcompatibility:
    name: PHPCompatibilityWP (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/phpcs --standard=PHPCompatibilityWP --runtime-set testVersion ${{ matrix.php }} get-patterns-by-pattern-name.php
